name: CI - Staging

on:
  push:
    tags:
      - "release/v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Switch to PackageReference for Docker build
        run: |
          # Use main version format (assuming tags are cut from main/release branches that use stable versions)
          VERSION_FORMAT="1.0.*"
          find . -name "*.csproj" -type f -exec sed -i \
            's|<ProjectReference Include=".*Maliev.Aspire.ServiceDefaults.*.csproj" />|<PackageReference Include="Maliev.Aspire.ServiceDefaults" Version="'$VERSION_FORMAT'" />|g' \
            {} +
          find . -name "*.csproj" -type f -exec sed -i \
            's|<ProjectReference Include=".*Maliev.MessagingContracts.*.csproj" />|<PackageReference Include="Maliev.MessagingContracts" Version="'$VERSION_FORMAT'" />|g' \
            {} +
          echo "Switched to PackageReference for ServiceDefaults and MessagingContracts"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: maliev-website

      - name: Build and push Docker image
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev
          RELEASE_VERSION=$(echo ${{ github.ref }} | sed -e 's,.*/v,,g')
          NUGET_USERNAME=${{ github.actor }} \
          NUGET_PASSWORD=${{ secrets.GITOPS_PAT }} \
            docker build \
            --secret id=nuget_username,env=NUGET_USERNAME \
            --secret id=nuget_password,env=NUGET_PASSWORD \
            -t asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-staging/maliev-delivery-service:$RELEASE_VERSION \
            -f Maliev.DeliveryService.Api/Dockerfile .
          docker push asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-staging/maliev-delivery-service:$RELEASE_VERSION

      - name: Checkout maliev-gitops repository
        uses: actions/checkout@v4
        with:
          repository: MALIEV-Co-Ltd/maliev-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: maliev-gitops

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tag in maliev-gitops using Kustomize
        run: |
          RELEASE_VERSION=$(echo ${{ github.ref }} | sed -e 's,.*/v,,g')
          cd maliev-gitops/3-apps/maliev-delivery-service/overlays/staging
          kustomize edit set image \
            asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact/maliev-delivery-service=\
          asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-staging/maliev-delivery-service:$RELEASE_VERSION

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
          PR_BODY: |
            Automated GitOps Update

            - **Service**: DeliveryService
            - **Environment**: Staging
            - **Release**: ${{ github.ref_name }}
            - **Image Tag**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}

            Updates maliev-delivery-service image in staging overlay.
            This PR was automatically created by GitHub Actions.
            Once merged, ArgoCD will automatically sync the changes to the maliev-staging namespace.

            Triggered by: ${{ github.actor }}
            Workflow: ${{ github.workflow }}
            Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        run: |
          cd maliev-gitops
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Extract release version
          RELEASE_VERSION=$(echo ${{ github.ref }} | sed -e 's,.*/v,,g')

          # Create a new branch for this update
          BRANCH_NAME="delivery-service/staging-$RELEASE_VERSION"
          git checkout -b $BRANCH_NAME

          # Commit and push changes to the new branch
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(staging): Update DeliveryService image to $RELEASE_VERSION"
          git push origin $BRANCH_NAME

          # Create pull request using GitHub CLI
          gh pr create \
            --title "chore(staging): Update delivery-service" \
            --body "$PR_BODY" \
            --base main \
            --head $BRANCH_NAME \
            --repo MALIEV-Co-Ltd/maliev-gitops
