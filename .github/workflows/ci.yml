name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      # Service containers if needed (Integration tests use Testcontainers, so maybe not strictly needed if Docker is available)
      # docker:dind is implicitly available on ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Maliev.DeliveryService.slnx

    - name: Build
      run: dotnet build Maliev.DeliveryService.slnx --no-restore --configuration Release

    - name: Test (Unit)
      run: dotnet test Maliev.DeliveryService.Tests/Maliev.DeliveryService.Tests.csproj --no-build --configuration Release --filter "Category!=Integration" --logger trx --results-directory "TestResults"

    # Integration tests require Docker. 
    # Testcontainers should work out of the box on GitHub-hosted runners.
    - name: Test (Integration)
      run: dotnet test Maliev.DeliveryService.Tests/Maliev.DeliveryService.Tests.csproj --no-build --configuration Release --filter "Category=Integration" --logger trx --results-directory "TestResults"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults
